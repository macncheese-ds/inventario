version: '3.8'

services:
  # Combined Frontend + Backend in one container
  app-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: inventario-app-test
    environment:
      # Backend
      NODE_ENV: development
      PORT: 5001
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: inventario
      DB_PASSWORD: inventario123
      DB_NAME: inventario
      JWT_SECRET: your-test-secret-key-change-in-production
      UPLOAD_DIR: /app/backend/uploads
      # Frontend
      VITE_API_URL: http://localhost:5001/api
    ports:
      - "5174:5173"  # Frontend (Vite)
      - "5001:5001"  # Backend (Express)
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - backend-test-uploads:/app/backend/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - inventario-test-network

volumes:
  backend-test-uploads:

networks:
  inventario-test-network:
    driver: bridge
